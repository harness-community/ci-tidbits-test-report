[pytest]
# Stable JUnit XML shape for Harness Tests tab parsing (also required if you
# later enable test splitting with Pytest in a Run step).
junit_family = xunit1

# Add the repo root to sys.path so `from app.main import ...` resolves.
# Without this, Pytest's default "prepend" import mode only puts the
# tests/ directory on sys.path (tests/ has no __init__.py), not the repo
# root where app/ lives — causing "ModuleNotFoundError: No module named 'app'"
# when the pipeline runs `pytest tests/` from /harness.
pythonpath = .
